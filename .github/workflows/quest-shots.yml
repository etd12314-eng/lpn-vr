# Laparoskop / ameliyathane görünümlerinin ekran görüntüleri (yazılım GPU'su, llvmpipe) — görsel kontrol için.
name: Quest Shots

on:
  workflow_dispatch:
  push:
    paths:
      - 'unity/LPN-VR/Assets/**'
      - '.github/workflows/quest-shots.yml'

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Disk alanı aç
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: unity/LPN-VR/Library
          key: Library-Android-${{ hashFiles('unity/LPN-VR/Packages/manifest.json', 'unity/LPN-VR/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Android-

      - name: Ekran görüntüleri
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity/LPN-VR
          targetPlatform: Android
          buildName: LPN-VR
          buildMethod: LPNVR.EditorTools.ProjectSetup.ShotsCI
          androidExportType: androidPackage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LPN-VR-shots
          path: unity/LPN-VR/Shots/*.png
          if-no-files-found: warn
